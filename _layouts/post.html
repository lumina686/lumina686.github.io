---
layout: default
---
<div class="wrap post">
  <header class="post-head glass reveal">
    <a class="post-back" href="{{ '/' | relative_url }}#writing">← 全部文章</a>
    <p class="post-meta">{{ page.date | date: '%Y.%m.%d' }}{% if page.tags %} · {{ page.tags | join: ' / ' }}{% endif %}</p>
    <h1>{{ page.title }}</h1>
    {% if page.excerpt %}<p class="post-excerpt">{{ page.excerpt }}</p>{% endif %}
  </header>

  <div class="post-body glass glass--solid reveal" style="--d: 80ms">
    <div class="prose">{{ content }}</div>
  </div>

  <p class="post-foot reveal"><a class="btn" href="{{ '/' | relative_url }}#writing">← 返回文章列表</a></p>
</div>
