name: Publish blog post

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number to publish
        required: true
        type: number

permissions:
  contents: write
  issues: write
  actions: write

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || (github.event.issue.user.login == 'lumina686' && !contains(github.event.issue.labels.*.name, 'photo-post') && !contains(github.event.issue.body, '### 照片'))
    runs-on: ubuntu-latest
    steps:
      - name: Create article and deploy
        uses: actions/github-script@v7
        env:
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        with:
          script: |
            const issue = context.payload.issue || (await github.rest.issues.get({
              ...context.repo, issue_number: Number(process.env.ISSUE_NUMBER)
            })).data;
            if (issue.user.login !== 'lumina686') throw new Error('只有站长可以发布文章。');
            if (issue.pull_request) throw new Error('只能发布文章记录。');
            const marker = '### 正文';
            const body = (issue.body || '').trim();
            const start = body.indexOf(marker);
            const content = (start < 0 ? body : body.slice(start + marker.length)).trim();
            if (!content || content === '_No response_') throw new Error('正文不能为空。');

            const parts = new Intl.DateTimeFormat('en-US', {
              timeZone: 'Asia/Shanghai', year: 'numeric', month: '2-digit', day: '2-digit'
            }).formatToParts(new Date(issue.created_at));
            const value = type => parts.find(part => part.type === type).value;
            const date = `${value('year')}-${value('month')}-${value('day')}`;
            const path = `_posts/${date}-post-${issue.number}.md`;
            const excerpt = content.split(/\n\s*\n/).map(s => s.replace(/[#>*_`!\[\]()]/g, '').trim()).find(Boolean)?.slice(0, 110) || '';
            const article = [
              '---', 'layout: post', `title: ${JSON.stringify(issue.title.trim())}`,
              `date: ${date}`, `excerpt: ${JSON.stringify(excerpt)}`, 'tags:', '  - 随笔',
              '---', '', content, ''
            ].join('\n');

            await github.rest.repos.createOrUpdateFileContents({
              ...context.repo, path,
              message: `Publish blog post #${issue.number}: ${issue.title}`,
              content: Buffer.from(article).toString('base64'),
              branch: context.payload.repository.default_branch
            });
            await github.rest.actions.createWorkflowDispatch({
              ...context.repo, workflow_id: 'pages.yml',
              ref: context.payload.repository.default_branch
            });
            await github.rest.issues.update({
              ...context.repo, issue_number: issue.number,
              state: 'closed', state_reason: 'completed'
            });
