name: Publish photo post

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write
  actions: write

jobs:
  publish:
    if: github.event.issue.user.login == 'lumina686' && (contains(github.event.issue.labels.*.name, 'photo-post') || contains(github.event.issue.body, '### 照片'))
    runs-on: ubuntu-latest
    steps:
      - name: Create photo post and deploy
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const body = issue.body || '';
            const photoStart = body.indexOf('### 照片');
            if (photoStart < 0) throw new Error('缺少照片，请使用“上传照片”表单。');
            const captionStart = body.indexOf('### 说明', photoStart);
            const photoText = body.slice(photoStart + '### 照片'.length, captionStart < 0 ? undefined : captionStart);
            const caption = captionStart < 0 ? '' : body.slice(captionStart + '### 说明'.length).trim();
            const links = [...photoText.matchAll(/!?\[([^\]]*)\]\((https:\/\/[^)\s]+)\)/g)];
            const photos = links.map(match => `![${match[1].replace(/[\[\]]/g, '')}](${match[2]})`);
            if (!photos.length) throw new Error('没有找到上传的照片。');

            const parts = new Intl.DateTimeFormat('en-US', {
              timeZone: 'Asia/Shanghai', year: 'numeric', month: '2-digit', day: '2-digit'
            }).formatToParts(new Date(issue.created_at));
            const value = type => parts.find(part => part.type === type).value;
            const date = `${value('year')}-${value('month')}-${value('day')}`;
            const path = `_posts/${date}-photo-${issue.number}.md`;
            const description = caption === '_No response_' ? '' : caption;
            const excerpt = description.split('\n')[0].slice(0, 110) || '一组照片。';
            const article = [
              '---', 'layout: post', `title: ${JSON.stringify(issue.title.trim())}`,
              `date: ${date}`, `excerpt: ${JSON.stringify(excerpt)}`, 'tags:', '  - 摄影',
              '---', '', ...photos.flatMap(photo => [photo, '']), description, ''
            ].join('\n');

            await github.rest.repos.createOrUpdateFileContents({
              ...context.repo, path,
              message: `Publish photo post #${issue.number}: ${issue.title}`,
              content: Buffer.from(article).toString('base64'),
              branch: context.payload.repository.default_branch
            });
            await github.rest.actions.createWorkflowDispatch({
              ...context.repo, workflow_id: 'pages.yml',
              ref: context.payload.repository.default_branch
            });
            await github.rest.issues.update({
              ...context.repo, issue_number: issue.number,
              state: 'closed', state_reason: 'completed'
            });
