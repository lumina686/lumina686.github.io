name: 上传照片
description: 站长上传照片，提交后自动发布到博客
title: ""
labels: ["photo-post"]
body:
  - type: markdown
    attributes:
      value: "用 lumina686 账号填写标题并选择照片。提交后会自动发布，其他账号提交的内容不会成为文章。"
  - type: upload
    id: photos
    attributes:
      label: 照片
      description: 点击选择照片，或拖入照片；支持多张，每张不超过 10 MB。
    validations:
      required: true
      accept: ".png,.jpg,.jpeg,.gif,.webp"
  - type: textarea
    id: caption
    attributes:
      label: 说明
      description: 可选，写几句照片背后的故事。
    validations:
      required: false
