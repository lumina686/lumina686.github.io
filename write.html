---
layout: default
title: 写作
---
<section class="wrap editor" aria-labelledby="editor-title">
  <div class="editor__panel glass">
    <p class="eyebrow">Private editor</p>
    <h1 id="editor-title">写点东西</h1>
    <p class="editor__intro">写作时自动保存到这台设备。只有点击发布后，改动才会公开；只有站长账号能保存到博客。</p>
    <div class="editor__modes" role="group" aria-label="内容类型">
      <a id="mode-post" href="{{ '/write/' | relative_url }}?mode=post">文章</a>
      <a id="mode-photo" href="{{ '/write/' | relative_url }}?mode=photo">照片</a>
    </div>
    <form id="editor-form">
      <label for="post-title">标题</label>
      <input id="post-title" name="title" type="text" maxlength="120" required autocomplete="off" placeholder="给这篇内容起个标题">
      <label for="post-body" id="body-label">正文</label>
      <textarea id="post-body" name="body" rows="14" placeholder="从这里开始写……"></textarea>
      <label for="post-photos">照片</label>
      <button id="paste-photo" class="btn" type="button">粘贴照片</button>
      <input id="post-photos" name="photos" type="file" accept="image/png,image/jpeg,image/gif,image/webp" multiple>
      <p class="editor__hint">可直接按 Ctrl+V 粘贴图片，也可选多张照片；每张不超过 5 MB。照片会随草稿保存在这台设备。</p>
      <div id="photo-preview" class="editor__preview" aria-live="polite"></div>
      <label for="github-token">GitHub 发布令牌</label>
      <input id="github-token" name="token" type="password" autocomplete="off" placeholder="发布时填写，只在当前浏览器会话中使用">
      <p class="editor__hint">首次使用请在 GitHub 创建仅授权此博客仓库、Contents 读写权限的细粒度令牌。<a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">创建令牌</a></p>
      <div class="editor__actions">
        <button id="publish-button" class="btn btn--primary" type="submit">发布到博客</button>
        <button id="clear-button" class="btn" type="button">删除本机草稿</button>
      </div>
      <p id="editor-status" class="editor__status" role="status" aria-live="polite">正在读取本机草稿…</p>
    </form>
  </div>
</section>
<script src="{{ '/assets/write.js' | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>
